<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f39a2c"><link rel="manifest" href="./manifest.webmanifest"><title>Euroferramenta</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#14242e;background:#f2f5f7}*{box-sizing:border-box}body{margin:0}.top{background:#fff;padding:18px;border-bottom:1px solid #e1e7eb;position:sticky;top:0}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;background:#f39a2c;display:grid;place-items:center;font-size:25px}.brand h1{margin:0;font-size:22px}.status{margin-top:12px;padding:12px;border-radius:12px;background:#eef2f4;font-weight:800}.ok{background:#e8f7ee;color:#14683b}.bad{background:#fff1eb;color:#a94720}.search{padding:12px 16px;background:#fff}.search input{width:100%;padding:13px;border:1px solid #ccd6dd;border-radius:12px;font:inherit}.cards{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{background:#fff;border:1px solid #e4eaee;border-radius:16px;padding:14px}.card b,.card span,.card small{display:block}.card span,.card small{color:#687984;margin-top:4px}.price{font-weight:900;margin-top:8px}.hidden{display:none}.retry{margin-top:10px;padding:10px 14px;border:0;border-radius:10px;background:#f39a2c;font-weight:900}</style></head><body><div class="top"><div class="brand"><div class="logo" id="brandLogo">🔧</div><div><h1>Euroferramenta</h1><small>Vallefoglia (PU)</small></div></div><div id="status" class="status">👻 Cerco automaticamente il server…</div><button id="installApp" class="retry">📲 Installa App</button><button id="retry" class="retry hidden">Riprova</button><div id="installHint" style="font-size:12px;margin-top:8px;color:#687984"></div></div><div id="offline" class="hidden"><div class="search"><input id="q" placeholder="Cerca codice, EAN, descrizione, modello…"></div><div id="cards" class="cards"></div></div><script>const GHOST="https://gianixxo.github.io/euroferramenta-mobile/ghost.json",COMPANY="Euroferramenta",LOGO="",$=s=>document.querySelector(s),clean=u=>String(u||'').trim().replace(/\/+$/,'');let installPrompt=null;if(LOGO){$('#brandLogo').innerHTML='<img alt="logo" src="'+LOGO+'" style="width:100%;height:100%;object-fit:contain">'}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installHint').textContent='Pronta per installazione con un tocco.'});$('#installApp').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);$('#installHint').textContent=ios?'Su iPhone: Condividi → Aggiungi alla schermata Home.':'Nel menu del browser scegli Installa app / Aggiungi a schermata Home.'};async function ghost(){try{const r=await fetch(GHOST+(GHOST.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={url:t.trim()}};return clean(j.url||String(j.catalogUrl||'').replace(/\/catalogo\/?$/,''))}catch{return clean(localStorage.getItem('ef-fixed-last-server')||'')}}async function alive(u){try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),4000),r=await fetch(clean(u)+'/health?t='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(tm);return r.ok}catch{return false}}async function cache(u){try{const r=await fetch(clean(u)+'/api/items?type=product',{cache:'no-store'});if(!r.ok)return;const items=await r.json();localStorage.setItem('ef-fixed-catalog',JSON.stringify({at:Date.now(),items:items.slice(0,4000)}))}catch{}}function offline(){let b={};try{b=JSON.parse(localStorage.getItem('ef-fixed-catalog')||'{}')}catch{};const all=b.items||[];$('#status').className='status bad';$('#status').textContent=all.length?'📴 Server spento · apro l’ultima copia del catalogo':'Server non raggiungibile. Il catalogo offline sarà disponibile dopo almeno una sincronizzazione.';$('#retry').classList.remove('hidden');if(!all.length)return;$('#offline').classList.remove('hidden');const draw=()=>{const q=($('#q').value||'').toLowerCase().trim();const x=all.filter(i=>!q||[i.code,i.ean,i.model,i.familyTitle,i.description].join(' ').toLowerCase().includes(q)).slice(0,600);$('#cards').innerHTML=x.map(i=>'<article class="card"><b>'+String(i.familyTitle||i.description||i.model||'Prodotto').replace(/[<&]/g,'')+'</b><span>'+String(i.description||'').replace(/[<&]/g,'')+'</span><small>Cod. '+(i.code||'-')+(i.ean?' · EAN '+i.ean:'')+'</small>'+(Number(i.priceExVat??i.price)>0?'<div class="price">€ '+Number(i.priceExVat??i.price).toFixed(2).replace('.',',')+' + IVA</div>':'')+'</article>').join('')};$('#q').oninput=draw;draw()}async function go(){if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});const u=await ghost();if(u&&await alive(u)){localStorage.setItem('ef-fixed-last-server',u);$('#status').className='status ok';$('#status').textContent='✓ Server trovato · apro il catalogo…';await cache(u);setTimeout(()=>location.replace(u+'/catalogo/'),150);return}offline()}$('#retry').onclick=()=>location.reload();go();</script></body></html>
