<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f39a2c"><link rel="manifest" href="./manifest.webmanifest"><title>Euroferramenta</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#14242e;background:#f2f5f7}*{box-sizing:border-box}body{margin:0}.top{background:#fff;padding:18px;border-bottom:1px solid #e1e7eb;position:sticky;top:0;z-index:5}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;background:#f39a2c;display:grid;place-items:center;font-size:25px;overflow:hidden}.brand h1{margin:0;font-size:22px}.status{margin-top:12px;padding:12px;border-radius:12px;background:#eef2f4;font-weight:800}.ok{background:#e8f7ee;color:#14683b}.warn{background:#fff7e5;color:#855d08}.bad{background:#fff1eb;color:#a94720}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.search{padding:12px 16px;background:#fff}.search input{width:100%;padding:13px;border:1px solid #ccd6dd;border-radius:12px;font:inherit}.meta{padding:0 16px 8px;color:#687984;font-size:13px}.cards{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{background:#fff;border:1px solid #e4eaee;border-radius:16px;padding:14px}.cardImage{height:150px;display:grid;place-items:center;background:#f7f9fa;border-radius:12px;margin-bottom:10px;overflow:hidden}.cardImage img{width:100%;height:100%;object-fit:contain}.card b,.card span,.card small{display:block}.card span,.card small{color:#687984;margin-top:4px}.price{font-weight:900;margin-top:8px}.hidden{display:none}.btn{padding:10px 14px;border:0;border-radius:10px;background:#f39a2c;font-weight:900}.btn.secondary{background:#eef2f4}.mode{font-size:12px;margin-top:6px;color:#687984}</style></head><body><div class="top"><div class="brand"><div class="logo" id="brandLogo">🔧</div><div><h1>Euroferramenta</h1><small>Vallefoglia (PU)</small></div></div><div id="status" class="status">👻 Avvio app fissa…</div><div class="toolbar"><button id="installApp" class="btn">📲 Installa App</button><button id="retry" class="btn secondary">↻ Aggiorna</button><span id="liveBtn" class="mode hidden">⚡ Dati live collegati</span></div><div id="installHint" class="mode"></div></div><div class="search"><input id="q" placeholder="Cerca marca, codice, EAN, descrizione, modello…"></div><div id="meta" class="meta"></div><div id="cards" class="cards"></div><script>
const GHOST="https://gianixxo.github.io/euroferramenta-mobile/ghost.json",COMPANY="Euroferramenta",LOGO="",$=s=>document.querySelector(s),clean=u=>String(u||'').trim().replace(/\/+$/,'');let installPrompt=null,all=[],liveBase='',source='';
if(LOGO){$('#brandLogo').innerHTML='<img alt="logo" src="'+LOGO+'" style="width:100%;height:100%;object-fit:contain">'}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installHint').textContent='Pronta per installazione con un tocco.'});
$('#installApp').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);$('#installHint').textContent=ios?'Su iPhone: Safari → Condividi → Aggiungi alla schermata Home.':'Nel menu del browser scegli Installa app / Aggiungi a schermata Home.'};
async function ghost(){try{const r=await fetch(GHOST+(GHOST.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={url:t.trim()}};return clean(j.url||String(j.catalogUrl||'').replace(/\/catalogo\/?$/,''))}catch{return clean(localStorage.getItem('ef-fixed-last-server')||'')}}
async function alive(u){try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),4000),r=await fetch(clean(u)+'/health?t='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(tm);return r.ok}catch{return false}}
async function serverCatalog(u){try{const r=await fetch(clean(u)+'/api/items?type=product',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const items=await r.json();const box={at:Date.now(),items:items.slice(0,10000),source:'server'};localStorage.setItem('ef-fixed-catalog',JSON.stringify(box));return box}catch{return null}}
async function githubSnapshot(){try{const r=await fetch('./catalog-snapshot.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;const j=await r.json();const items=Array.isArray(j)?j:(j.items||j.products||[]);if(!items.length)return null;const box={at:Date.now(),items:items.slice(0,10000),source:'github'};localStorage.setItem('ef-fixed-catalog',JSON.stringify(box));return box}catch{return null}}
function cached(){try{return JSON.parse(localStorage.getItem('ef-fixed-catalog')||'{}')}catch{return{}}}
function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imageUrl(i){if(source==='server'&&liveBase&&i.image)return liveBase+'/product-images/'+encodeURIComponent(i.image);return''}
function draw(){const q=($('#q').value||'').toLowerCase().trim();const x=all.filter(i=>!q||[i.brand,i.code,i.ean,i.model,i.familyTitle,i.description,i.category].join(' ').toLowerCase().includes(q)).slice(0,1200);$('#meta').textContent=x.length+' risultati · '+(source==='server'?'LIVE dal negozio':source==='github'?'COPIA CLOUD GitHub Pages':'COPIA salvata sul telefono');$('#cards').innerHTML=x.map(i=>{const img=imageUrl(i);return '<article class="card"><div class="cardImage">'+(img?'<img loading="lazy" src="'+img+'" alt="'+e(i.description||i.familyTitle||'Prodotto')+'">':'<span>Foto disponibile quando il server live è online</span>')+'</div><b>'+e(i.familyTitle||i.model||i.description||'Prodotto')+'</b><span>'+e(i.description||'')+'</span><small>'+e(i.brand||'')+(i.brand?' · ':'')+'Cod. '+e(i.code||'-')+(i.ean?' · EAN '+e(i.ean):'')+'</small>'+(Number(i.priceExVat??i.price)>0?'<div class="price">€ '+Number(i.priceExVat??i.price).toFixed(2).replace('.',',')+' + IVA</div>':'')+'</article>'}).join('')||'<article class="card"><b>Nessun risultato</b></article>'}
async function loadFixed(){if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});$('#status').className='status';$('#status').textContent='👻 Controllo collegamento live…';const u=await ghost();if(u&&await alive(u)){liveBase=u;localStorage.setItem('ef-fixed-last-server',u);const b=await serverCatalog(u);if(b?.items?.length){all=b.items;source='server';$('#status').className='status ok';$('#status').textContent='✓ ONLINE · Server Lite collegato. L’app resta comunque sull’indirizzo fisso.';$('#liveBtn').classList.remove('hidden');draw();showInstallCoach();return}}
let b=await githubSnapshot();if(!b?.items?.length)b=cached();all=b?.items||[];source=b?.source||'cache';$('#liveBtn').classList.add('hidden');$('#status').className=all.length?'status warn':'status bad';$('#status').textContent=all.length?'☁ PC/Server spento · app sempre attiva su GitHub Pages con ultimo catalogo pubblicato.':'Server spento e nessuna copia catalogo ancora pubblicata.';draw()}
function iosEnv(){const ua=navigator.userAgent||'';const ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const safari=ios&&/Safari/i.test(ua)&&!/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/i.test(ua);const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;return{ios,safari,standalone}}
function showInstallCoach(){const e=iosEnv();if(!e.ios||e.standalone)return;if(e.safari){$('#installHint').innerHTML='<b>iPhone:</b> tocca Condividi ⤴︎ → Aggiungi alla schermata Home → Aggiungi. Dopo userai sempre questa icona e questo indirizzo fisso.';$('#installApp').textContent='📲 Mostra installazione iPhone';$('#installApp').onclick=async()=>{if(navigator.share){try{await navigator.share({title:COMPANY,url:location.href})}catch{}}$('#installHint').innerHTML='<b>Ora in Safari:</b> Condividi ⤴︎ → Aggiungi alla schermata Home → Aggiungi.'}}else{$('#installHint').innerHTML='<b>iPhone rilevato:</b> per installare la web-app iOS serve Safari. Copia questo indirizzo fisso, apri Safari e incollalo: <code>'+location.href+'</code>';$('#installApp').textContent='📋 Copia indirizzo per Safari';$('#installApp').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('#installHint').innerHTML='<b>Copiato.</b> Apri Safari → incolla → Condividi ⤴︎ → Aggiungi alla schermata Home.'}catch{}}}}
$('#q').oninput=draw;$('#retry').onclick=loadFixed;showInstallCoach();loadFixed();
</script></body></html>
